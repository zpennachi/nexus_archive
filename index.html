  <script>
    let allItems = [];
    let allCollections = [];
    let activeCategory = 'all';
    let activeCollection = null;
    let searchQuery = '';
    let sortMode = 'name_asc';
    let currentPage = 1;
    const PAGE_SIZE = 36;
    let currentModalIndex = 0;
    let filteredItems = [];
    let activeModalTab = 'trans';

    // Direct Supabase REST Fetcher
    async function fetchFromSupabase() {
      const url = window.SUPABASE_CONFIG.url;
      const key = window.SUPABASE_CONFIG.anonKey;

      if (url && key) {
        const headers = {
          "apikey": key,
          "Authorization": `Bearer ${key}`
        };

        const [colsRes, artsRes] = await Promise.all([
          fetch(`${url}/rest/v1/collections?select=*&order=name.asc`, { headers }),
          fetch(`${url}/rest/v1/artifacts?select=*&order=title.asc&limit=1000`, { headers })
        ]);

        if (colsRes.ok && artsRes.ok) {
          const rawCollections = await colsRes.json();
          const dbArtifacts = await artsRes.json();
          
          if (dbArtifacts.length > 0) {
            allItems = dbArtifacts.map(a => {
              const previewFile = a.preview_url ? a.preview_url.split('/').pop() : a.filename;
              const storageUrl = `${url}/storage/v1/object/public/previews/${previewFile}`;
              
              return {
                id: a.id,
                filename: a.filename,
                collection: a.collection,
                category: a.category,
                title: a.title,
                date_depicted: a.date_depicted,
                format: a.format,
                file_size: a.file_size,
                preview_url: storageUrl,
                thumbnail_url: storageUrl,
                ai_content: a.ai_content || {
                  document_type: a.title,
                  language: a.language,
                  key_entities: a.entities || [],
                  transcribed_text: a.script_text || '',
                  english_translation: a.overview || ''
                }
              };
            });

            // Dynamically recalculate collection counts based on active assets
            const colItemCounts = {};
            allItems.forEach(i => {
              colItemCounts[i.collection] = (colItemCounts[i.collection] || 0) + 1;
            });

            // Filter out empty collections from sidebar
            allCollections = rawCollections
              .filter(c => (colItemCounts[c.name] || 0) > 0)
              .map(c => ({
                ...c,
                item_count: colItemCounts[c.name]
              }));

            document.getElementById('stats-banner').textContent = 
              `${allItems.length.toLocaleString()} curated artifacts across ${allCollections.length} collections`;
            return true;
          }
        }
      }
      return false;
    }

    async function init() {
      try {
        const connected = await fetchFromSupabase();
        
        if (!connected) {
          const [itemsRes, colsRes] = await Promise.all([
            fetch('catalog.json'),
            fetch('collections.json')
          ]);
          allItems = (await itemsRes.json()).slice(0, 1000);
          allCollections = await colsRes.json();

          document.getElementById('stats-banner').textContent = 
            `${allItems.length.toLocaleString()} catalogued artifacts across ${allCollections.length} collections (Local Cache)`;
        }

        renderCollectionList();
        applyFilters();
        setupEvents();
      } catch (err) {
        document.getElementById('stats-banner').textContent = 'Error loading archive: ' + err.message;
      }
    }

    function renderCollectionList() {
      const listEl = document.getElementById('collections-list');
      listEl.innerHTML = '';
      
      const filteredCols = activeCategory === 'all' 
        ? allCollections 
        : allCollections.filter(c => c.category === activeCategory);
      
      document.getElementById('col-count').textContent = filteredCols.length;

      filteredCols.forEach(col => {
        const li = document.createElement('li');
        const isActive = activeCollection === col.name;
        
        li.innerHTML = `
          <button class="w-full text-left px-2.5 py-1.5 rounded-xs transition flex items-center justify-between font-serif-title cursor-pointer ${
            isActive 
              ? 'bg-[#6E3F18] text-white font-bold shadow-2xs hover:bg-[#573112]' 
              : 'text-[#111827] font-semibold hover:bg-[#EFEAE2] hover:text-[#6E3F18]'
          }">
            <span class="truncate pr-2 text-sm leading-snug">${col.name}</span>
            <span class="text-[11px] font-mono font-sans ${isActive ? 'text-white/95' : 'text-[#4B5563] font-bold'}">${col.item_count}</span>
          </button>
        `;
        li.querySelector('button').addEventListener('click', () => {
          activeCollection = (activeCollection === col.name) ? null : col.name;
          document.getElementById('reset-col-filter').classList.toggle('hidden', !activeCollection);
          currentPage = 1;
          renderCollectionList();
          applyFilters();
        });
        listEl.appendChild(li);
      });
    }

    function applyFilters() {
      filteredItems = allItems.filter(item => {
        if (activeCategory !== 'all' && item.category !== activeCategory) return false;
        if (activeCollection && item.collection !== activeCollection) return false;
        
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = (item.title || '').toLowerCase().includes(q);
          const matchCol = (item.collection || '').toLowerCase().includes(q);
          const matchFile = item.filename.toLowerCase().includes(q);
          
          let matchAI = false;
          if (item.ai_content) {
            const ai = item.ai_content;
            matchAI = (ai.english_translation || '').toLowerCase().includes(q) ||
                      (ai.transcribed_text || '').toLowerCase().includes(q) ||
                      (ai.historical_summary || '').toLowerCase().includes(q) ||
                      (ai.document_type || '').toLowerCase().includes(q) ||
                      (ai.language || '').toLowerCase().includes(q) ||
                      (ai.key_entities || []).some(e => e.toLowerCase().includes(q));
          }
          
          if (!matchTitle && !matchCol && !matchFile && !matchAI) {
            return false;
          }
        }
        return true;
      });

      if (sortMode === 'name_asc') {
        filteredItems.sort((a, b) => (a.title || a.filename).localeCompare(b.title || b.filename));
      } else if (sortMode === 'size_desc') {
        filteredItems.sort((a, b) => b.file_size - a.file_size);
      }

      document.getElementById('filtered-count').textContent = filteredItems.length.toLocaleString();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';

      const totalPages = Math.ceil(filteredItems.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      document.getElementById('page-indicator').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prev-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage === totalPages;

      const startIdx = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filteredItems.slice(startIdx, startIdx + PAGE_SIZE);

      if (pageItems.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-20 text-center text-[#111827] font-serif-title">
            <p class="text-base font-bold">No records match the active filter or search criteria.</p>
          </div>
        `;
        return;
      }

      pageItems.forEach((item, idx) => {
        const globalIdx = startIdx + idx;
        const card = document.createElement('article');
        card.className = 'animate-card-in group bg-white border border-[#DDD5C9] hover:border-[#6E3F18] rounded-xs overflow-hidden cursor-pointer transition duration-250 flex flex-col shadow-xs hover:shadow-md';
        
        const thumbSrc = item.thumbnail_url || item.preview_url || '';

        card.innerHTML = `
          <div class="aspect-[4/3] bg-[#EFEAE2] overflow-hidden relative flex items-center justify-center border-b border-[#EFEAE2]">
            <img src="${thumbSrc}" alt="${item.title || item.filename}" loading="lazy" class="w-full h-full object-cover group-hover:scale-103 transition duration-500 ease-out bg-[#F8F6F0]">
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between space-y-2">
            <div>
              <span class="truncate text-xs font-serif-title font-bold text-[#6E3F18] uppercase tracking-wider block mb-1">${item.collection}</span>
              <h4 class="text-lg sm:text-xl font-bold text-[#111827] font-serif-title leading-snug line-clamp-2 group-hover:text-[#6E3F18] transition duration-200">${item.title || item.filename}</h4>
            </div>
            <div class="pt-2 border-t border-[#EFEAE2] flex items-center justify-between text-xs text-[#111827] font-mono font-bold font-sans">
              <span class="uppercase">${item.format}</span>
              <span>${(item.file_size / 1024 / 1024).toFixed(1)} MB</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(globalIdx));
        grid.appendChild(card);
      });
    }

    function openModal(index) {
      currentModalIndex = index;
      const item = filteredItems[index];
      if (!item) return;

      const modal = document.getElementById('detail-modal');
      const img = document.getElementById('modal-img');
      const ai = item.ai_content;

      img.src = item.preview_url || item.thumbnail_url || '';
      document.getElementById('modal-title').textContent = item.title || item.filename;
      document.getElementById('modal-col-badge').textContent = item.collection;

      // Reading Section (English Overview vs Original Script)
      const transView = document.getElementById('modal-translation-view');
      const scriptView = document.getElementById('modal-script-view');
      const tabBtnTrans = document.getElementById('tab-btn-trans');
      const tabBtnOrig = document.getElementById('tab-btn-orig');

      const overviewText = (ai && ai.english_translation) 
        ? ai.english_translation 
        : ((ai && ai.historical_summary) ? ai.historical_summary : (item.description || 'Archival document preserved in collection.'));
      
      const scriptText = (ai && ai.transcribed_text) ? ai.transcribed_text : '';

      transView.textContent = overviewText;
      scriptView.textContent = scriptText || 'No original script transcribed for this record.';

      tabBtnOrig.classList.toggle('hidden', !scriptText);

      setModalTab('trans');

      tabBtnTrans.onclick = () => setModalTab('trans');
      tabBtnOrig.onclick = () => setModalTab('orig');

      document.getElementById('copy-active-text').onclick = () => {
        const textToCopy = (activeModalTab === 'trans') ? overviewText : scriptText;
        navigator.clipboard.writeText(textToCopy).then(() => {
          const btn = document.getElementById('copy-active-text');
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        });
      };

      // Entities
      const entWrap = document.getElementById('modal-detail-entities-wrap');
      const entities = (ai && ai.key_entities && ai.key_entities.length) ? ai.key_entities : [];
      if (entities.length > 0) {
        entWrap.classList.remove('hidden');
        const entContainer = document.getElementById('modal-detail-entities');
        entContainer.innerHTML = '';
        entities.forEach(ent => {
          const span = document.createElement('span');
          span.className = 'text-[11px] px-2.5 py-0.5 bg-[#F3EFE9] border border-[#DDD5C9] text-[#111827] rounded-xs font-bold';
          span.textContent = ent;
          entContainer.appendChild(span);
        });
      } else {
        entWrap.classList.add('hidden');
      }

      // Archival Details
      document.getElementById('modal-detail-col').textContent = item.collection;

      const langWrap = document.getElementById('modal-detail-lang-wrap');
      const langText = (ai && ai.language) ? ai.language : null;
      if (langText) {
        langWrap.classList.remove('hidden');
        document.getElementById('modal-detail-lang').textContent = langText;
      } else {
        langWrap.classList.add('hidden');
      }

      const sizeMB = (item.file_size / 1024 / 1024).toFixed(1);
      document.getElementById('modal-detail-fileinfo').textContent = `${item.format.toUpperCase()} (${sizeMB} MB)`;

      document.getElementById('modal-open-preview').href = item.preview_url || '#';
      document.getElementById('modal-prev').disabled = index === 0;
      document.getElementById('modal-next').disabled = index === filteredItems.length - 1;

      modal.classList.remove('hidden');
    }

    function setModalTab(tab) {
      activeModalTab = tab;
      const transView = document.getElementById('modal-translation-view');
      const scriptView = document.getElementById('modal-script-view');
      const tabBtnTrans = document.getElementById('tab-btn-trans');
      const tabBtnOrig = document.getElementById('tab-btn-orig');

      if (tab === 'trans') {
        transView.classList.remove('hidden');
        scriptView.classList.add('hidden');
        tabBtnTrans.className = 'font-serif-title font-bold text-base text-[#6E3F18] border-b-2 border-[#6E3F18] pb-1 cursor-pointer transition';
        tabBtnOrig.className = 'font-serif-title font-bold text-base text-[#111827] hover:text-[#6E3F18] pb-1 cursor-pointer transition';
      } else {
        transView.classList.add('hidden');
        scriptView.classList.remove('hidden');
        tabBtnOrig.className = 'font-serif-title font-bold text-base text-[#6E3F18] border-b-2 border-[#6E3F18] pb-1 cursor-pointer transition';
        tabBtnTrans.className = 'font-serif-title font-bold text-base text-[#111827] hover:text-[#6E3F18] pb-1 cursor-pointer transition';
      }
    }

    function setupEvents() {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(b => {
            b.classList.remove('active', 'bg-[#6E3F18]', 'text-white', 'hover:bg-[#573112]', 'shadow-2xs');
            b.classList.add('text-[#111827]', 'hover:text-[#6E3F18]', 'hover:bg-[#EFEAE2]');
          });
          btn.classList.add('active', 'bg-[#6E3F18]', 'text-white', 'hover:bg-[#573112]', 'shadow-2xs');
          btn.classList.remove('text-[#111827]', 'hover:text-[#6E3F18]', 'hover:bg-[#EFEAE2]');
          
          activeCategory = btn.getAttribute('data-cat');
          activeCollection = null;
          document.getElementById('reset-col-filter').classList.add('hidden');
          currentPage = 1;
          renderCollectionList();
          applyFilters();
        });
      });

      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        clearBtn.classList.toggle('hidden', !searchQuery);
        currentPage = 1;
        applyFilters();
      });
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearBtn.classList.add('hidden');
        currentPage = 1;
        applyFilters();
      });

      document.getElementById('reset-col-filter').addEventListener('click', () => {
        activeCollection = null;
        document.getElementById('reset-col-filter').classList.add('hidden');
        currentPage = 1;
        renderCollectionList();
        applyFilters();
      });

      document.getElementById('sort-select').addEventListener('change', (e) => {
        sortMode = e.target.value;
        applyFilters();
      });

      document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderGrid();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      document.getElementById('next-page').addEventListener('click', () => {
        currentPage++;
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('detail-modal').classList.add('hidden');
      });
      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'detail-modal') {
          document.getElementById('detail-modal').classList.add('hidden');
        }
      });
      document.getElementById('modal-prev').addEventListener('click', () => {
        if (currentModalIndex > 0) openModal(currentModalIndex - 1);
      });
      document.getElementById('modal-next').addEventListener('click', () => {
        if (currentModalIndex < filteredItems.length - 1) openModal(currentModalIndex + 1);
      });

      document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('detail-modal');
        if (!modal.classList.contains('hidden')) {
          if (e.key === 'Escape') modal.classList.add('hidden');
          if (e.key === 'ArrowLeft' && currentModalIndex > 0) openModal(currentModalIndex - 1);
          if (e.key === 'ArrowRight' && currentModalIndex < filteredItems.length - 1) openModal(currentModalIndex + 1);
        }
      });
    }

    init();
  </script>
</body>
</html>
